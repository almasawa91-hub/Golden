name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.2 }
      - name: Unit + integration tests (accounting, inventory, invoice flow)
        run: gradle :core:test --stacktrace
      - name: Lint
        run: gradle :data:lintDebug :app:lintDebug --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reports, path: "**/build/reports/**" }
      - uses: actions/upload-artifact@v4
        with: { name: debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }
