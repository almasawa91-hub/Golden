name: Unsigned Release APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Test, lint, and build unsigned release
        run: gradle :core:test :data:lintDebug :app:lintRelease :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify unsigned outputs exist
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          echo "Unsigned APK created: $APK"
          echo "Unsigned AAB created: $AAB"
          echo "Note: unsigned APKs cannot be installed until signed."

      - name: Upload unsigned APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Golden-unsigned-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 14
