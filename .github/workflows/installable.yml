name: Installable Debug APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installable-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Run tests and build installable debug APK
        run: gradle :core:test :app:assembleDebug --stacktrace

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify "$APK"
          echo "Installable debug APK verified: $APK"

      - uses: actions/upload-artifact@v4
        with:
          name: Golden-installable-debug-apk
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
