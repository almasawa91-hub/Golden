name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_name }}
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Configure release signing from repository secrets
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          printf 'KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test, lint and build release APK and AAB
        run: gradle :core:test :data:lintDebug :app:lintRelease :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          AAB=$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          if unzip -l "$APK" | grep -qi 'index.html'; then
            echo "Unexpected HTML app wrapper found in APK"
            exit 1
          fi
          if [[ -n "${KEYSTORE_PATH:-}" ]]; then
            BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
            "$BUILD_TOOLS/apksigner" verify "$APK"
            jarsigner -verify "$AAB"
            echo "Signed release artifacts verified."
          else
            echo "WARNING: artifacts are unsigned; configure signing secrets before publishing."
          fi
          echo "APK=$APK"
          echo "AAB=$AAB"

      - name: Upload signed release artifacts
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-publish
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Upload unsigned release artifacts
        if: ${{ env.HAS_SIGNING != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-unsigned-not-for-publishing
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
